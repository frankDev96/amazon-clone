name: Amazon Clone CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 tools/validate_harness.py
      - run: python3 scripts/audit_repository.py
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test -- --runInBand --ci
      - name: Visual compare self-test
        run: |
          python3 -m pip install -r requirements-visual-tests.txt
          python3 tools/visual_compare.py --self-test

  android-build:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error